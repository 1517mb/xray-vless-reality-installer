name: Installer checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq openssl shellcheck
      - name: Check Bash syntax
        run: |
          bash -n xray-install.sh
          bash -n xray-install-docker.sh
      - name: Run ShellCheck
        run: shellcheck xray-install.sh xray-install-docker.sh
      - name: Run installer regression tests
        run: python3 -m unittest discover -s tests -v
